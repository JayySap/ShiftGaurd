[tool.poetry]
name = "shiftguard"
version = "0.1.0"
description = "Compliant-by-design scheduler for Canadian businesses"
authors = ["ShiftGuard Team"]
readme = "docs/spec.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
flask = "^3.0.0"
psycopg2-binary = "^2.9.9"
pydantic = {version = "^2.5.0", extras = ["email"]}
pydantic-settings = "^2.1.0"
composio-core = "^0.7.21"
gunicorn = "^21.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
mypy = "^1.7.0"
types-psycopg2 = "^2.9.21"
ruff = "^0.1.0"
python-dotenv = "^1.0.0"

[tool.poetry.scripts]
shiftguard = "src.app:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Ruff configuration (fast Python linter/formatter)
[tool.ruff]
target-version = "py310"
line-length = 88
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.isort]
known-first-party = ["src"]

# MyPy configuration
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["composio.*", "psycopg2.*"]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing"
